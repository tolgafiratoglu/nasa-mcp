[project]
name = "nasa-mcp"
version = "0.1.0"
description = "NASA Mission Control MCP Server — AI-accessible space and Earth intelligence layer"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2,<3",
    "pydantic>=2.12",
    "httpx2>=2.5.0",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "httpx>=0.27",
]
agents = [
    "strands-agents>=1.0",
    "google-genai>=1.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # websockets 17 removed OP_BINARY; breaks MCP/Strands imports
    "websockets>=13,<17",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # uvicorn[standard] otherwise pulls websockets 17+
    "websockets>=13,<17",
]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasa_mcp", "src/agents", "src/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
